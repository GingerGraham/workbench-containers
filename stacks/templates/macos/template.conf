# template.conf — read as data by stack-new (grep/cut), never sourced.
# One KEY=value per line; space-separated lists.
DESCRIPTION=macOS in a KVM virtual machine (dockur/macos)
ALIASES=mac
REQUIRES=kvm avx2
ACCEPT=macOS is Apple's software. Apple's licence (EULA) allows it only on Apple-branded hardware, and dockur/macos asks you to run this container only on Apple hardware. stack-new can't check that for you.
ACCEPT_VENDOR_CHECK=Apple Inc.
DISK_VAR=MACOS_DISK_SIZE
DIRS=storage shared
NOCOW_DIRS=storage
BIND_VAR=MACOS_BIND
PORTS=MACOS_WEB_PORT:8006:web MACOS_VNC_PORT:5900:vnc
LOGIN_VARS=
SECRET_VARS=
STOP_TIMEOUT=120
NOTE=The first stack-up downloads macOS recovery from Apple; you then install macOS by hand in the web viewer. Steps: stack-help templates macos
